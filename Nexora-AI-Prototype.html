const rd=(k,d)=>{try{const x=JSON.parse(localStorage.getItem('nexora.'+k));return x===null?d:x}catch{return d}},save=(k,v)=>{try{localStorage.setItem('nexora.'+k,JSON.stringify(v));return true}catch{say('This browser could not save the change. Free some browser storage and try again.');return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let who=rd('profile','Student'),page='today',tasks=rd('tasks',[{id:'t1',title:'Review vectors and components',minutes:25,done:false},{id:'t2',title:'Solve 8 kinematics questions',minutes:35,done:true}]),habits=rd('habits',{}),mistakes=rd('mistakes',[]),books=rd('books',[]),savedLessons=rd('savedLessons',[]),chat=rd('chat',[]),requests=rd('requests',[]),goal=rd('goal','Build engineering foundations'),room=null,roomChat=[],timer=1500,timerId=null,photo='';
function say(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
const serverAvailable=()=>location.protocol==='http:'||location.protocol==='https:';
async function apiJson(url,options={}){
 if(!serverAvailable())throw new Error('Start the local Nexora server with Start-Nexora.bat, then open http://127.0.0.1:4173/.');
 const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});

}
let nexStatus=null,roomPeople=[],roomCursor=0,roomPollId=null,roomHeartbeatId=null,roomClientId=sessionGet('nexora.roomClientId'),roomDisplayName=sessionGet('nexora.roomName')||who.split(' ')[0]||'Student';
function roomApiKey(){return `p${room.place}-${room.batch.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)}`}
function drawRoomPeople(){let row=document.querySelector('.teddy-row');if(!row)return;row.innerHTML=roomPeople.map((p,i)=>`<div class="teddy ${p.id===roomClientId?'you':'classmate'}" style="animation-delay:${Math.min(i*.12,.8)}s"><span class="bear">${p.id===roomClientId?'🧸':['🐻','🐼','🐨','🦊','🐰'][i%5]}</span><small>${esc(p.name)}${p.id===roomClientId?' · you':''}</small><em>📖</em></div>`).join('')||'<div class="small">Waiting for students to join this live room…</div>';let count=document.querySelector('#roomLiveCount');if(count)count.textContent=`${roomPeople.length} online`}

async function syncRoom(){if(!room||!room.key)return;try{const data=await apiJson(`/api/rooms/${encodeURIComponent(room.key)}?since=${roomCursor}`);roomPeople=data.participants||[];roomCursor=data.cursor||roomCursor;for(const m of data.messages||[])if(!roomChat.some(x=>x.seq===m.seq))roomChat.push({seq:m.seq,n:m.name,t:m.text});drawRoomPeople();drawRoomChat();let state=document.querySelector('#roomLiveStatus');if(state)state.textContent='Live room · connected'}catch(e){let state=document.querySelector('#roomLiveStatus');if(state)state.textContent='Reconnecting · '+e.message}}
async function startLiveRoom(){if(!room)return;leaveLiveRoom(false);room.key=roomApiKey();roomPeople=[];roomChat=[];roomCursor=0;if(!roomClientId){roomClientId=crypto.randomUUID();sessionSet('nexora.roomClientId',roomClientId)}if(!serverAvailable()){let state=document.querySelector('#roomLiveStatus');if(state)state.textContent='Start the Nexora server to meet students in shared rooms.';drawRoomPeople();drawRoomChat();return}try{const joined=await apiJson(`/api/rooms/${encodeURIComponent(room.key)}/join`,{method:'POST',body:JSON.stringify({id:roomClientId,name:roomDisplayName})});roomPeople=joined.participants||[];drawRoomPeople();drawRoomChat();await syncRoom();roomPollId=setInterval(syncRoom,3000);roomHeartbeatId=setInterval(()=>apiJson(`/api/rooms/${encodeURIComponent(room.key)}/heartbeat`,{method:'POST',body:JSON.stringify({id:roomClientId})}).catch(()=>{}),8000)}catch(e){let state=document.querySelector('#roomLiveStatus');if(state)state.textContent=e.message;drawRoomPeople()}}
function leaveLiveRoom(send=true){if(roomPollId){clearInterval(roomPollId);roomPollId=null}if(roomHeartbeatId){clearInterval(roomHeartbeatId);roomHeartbeatId=null}if(send&&room?.key&&roomClientId&&serverAvailable())fetch(`/api/rooms/${encodeURIComponent(room.key)}/leave`,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({id:roomClientId})}).catch(()=>{});roomPeople=[];roomCursor=0}

function renderMentorCards(list){let el=document.querySelector('#mentorDirectory');if(!el)return;if(!list.length){el.innerHTML='<div class="empty">No mentors have been approved yet. Real people will appear here after they opt in and the project operator verifies their profile.</div>';return}el.innerHTML=`<div class="mentor-grid">${list.map(m=>`<article class="mentor"><span class="tag">Verified pilot mentor</span><h3>${esc(m.name)} · ${esc(m.year)}</h3><p><b>${esc(m.institution)}</b><br>${esc(m.topics)}<br>${esc(m.bio||'Peer guidance and study support')}<br>Availability: ${esc(m.availability)}</p><a class="btn pink small" href="mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent('Nexora AI · mentoring request')}&body=${encodeURIComponent('Hi '+m.name+', I found your mentor profile on Nexora AI and would like to ask about a 1:1 session.')}" rel="noopener">Email mentor ↗</a></article>`).join('')}</div>`}
